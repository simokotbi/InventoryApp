[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoffice"
version = "0.1.0"
description = "ChaOffice Core: Hybrid PySide6 QML Business Management App"
authors = [
    {name = "ChaOffice Team", email = "admin@example.com"}
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.4.0",
    "requests>=2.28.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "loguru>=0.7.0",
    "python-dateutil>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.qml", "*.qmldir", "*.svg", "*.json"]
